services:
  nginx:
    image: nginx:alpine
    ports:
      - "3000:3000" # <--- Esponiamo la porta 3000 di Nginx verso l'esterno
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server

  server:
    build: ./server
    # Rimuovi l'attributo ports da qui se presente. Express non deve esporre porte esternamente, 
    # ci parla Nginx internamente alla rete Docker sulla porta 3000.

  client:
    build: ./client
    # Anche qui, nessuna porta esposta verso l'esterno.