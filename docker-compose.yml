version: '3.8'

services:
  # Il "Vigile Urbano" che riceve il traffico esterno sulla porta 80
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server

  # Il Backend Express
  server:
    build: ./server
    # Non serve esporre le porte sul tuo PC, Nginx ci parla dentro la rete di Docker

  # Il Frontend React
  client:
    build: ./client
    # Anche qui, la porta 80 è accessibile solo a Nginx internamente