server {
    listen 3000; # <--- Ascolta sulla porta 3000, quella cercata da React!

    # 1. Se l'utente chiede la root (/), Nginx serve il Frontend (React)
    location / {
        proxy_pass http://client:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2. Se inizia con /api/, lo passa al Backend (Express)
    # NOTA: Rimuoviamo il vecchio 'rewrite' perché i tuoi fetch includono già /api/ nel percorso!
    location /api/ {
        proxy_pass http://server:3000; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Gestione dei log del server (es. POST /logs)
    location /logs {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}