<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Pagina Non Trovata | Gemini Playground</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- Modern Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --glow-purple: rgba(139, 92, 246, 0.15);
      --glow-blue: rgba(59, 130, 246, 0.15);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient animated glows */
    .glow-sphere {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 1;
      pointer-events: none;
      animation: float 12s ease-in-out infinite alternate;
    }

    .glow-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--glow-purple) 0%, transparent 70%);
      top: -100px;
      left: -100px;
    }

    .glow-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--glow-blue) 0%, transparent 70%);
      bottom: -150px;
      right: -150px;
      animation-delay: -4s;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(40px, 30px) scale(1.1);
      }
    }

    /* Glassmorphic Card Container */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 60px 40px;
      width: 90%;
      max-width: 540px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 10;
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Neon Glitchy 404 Text */
    .error-code {
      font-size: 120px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #4338ca 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      letter-spacing: -2px;
      position: relative;
      display: inline-block;
    }

    .error-code::after {
      content: '404';
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #4338ca 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: blur(15px);
      opacity: 0.5;
      z-index: -1;
    }

    h1 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    p {
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 40px;
      font-weight: 300;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Interactive button with micro-animation */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 12px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn svg {
      margin-right: 8px;
      transition: transform 0.25s ease;
    }

    .btn:hover svg {
      transform: translateX(-4px);
    }
  </style>
</head>
<body>

  <!-- Background decorative glowing effects -->
  <div class="glow-sphere glow-1"></div>
  <div class="glow-sphere glow-2"></div>

  <!-- Main Error Card -->
  <div class="card">
    <div class="error-code">404</div>
    <h1>Pagina Non Trovata</h1>
    <p>La risorsa che stai cercando potrebbe essere stata rimossa, rinominata o è temporaneamente non disponibile.</p>
    
    <a href="/" class="btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Torna alla Home
    </a>
  </div>

</body>
</html>
