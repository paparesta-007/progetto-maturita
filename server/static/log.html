<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Action Logs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0a0a0a;
            --border-color: rgba(255, 255, 255, 0.05);
            --text-primary: #ededed;
            --text-secondary: #888888;
            --accent-color: #3b82f6;
            --success-color: #10b981;
            --error-color: #ef4444;
            --glass-blur: 16px;
            
            --method-get: #3b82f6;
            --method-post: #10b981;
            --method-put: #f59e0b;
            --method-delete: #ef4444;
            --method-default: #888888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .refresh-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .refresh-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }

        .log-table-container {
            background: var(--card-bg);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #020202;
            padding: 0.5rem 1rem;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        td {
            padding: 0.5rem 1rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.75rem;
            vertical-align: middle;
        }

        .audit-row {
            cursor: pointer;
            transition: background 0.2s;
        }

        .audit-row:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .audit-details {
            display: none;
            background: #020202;
        }

        .audit-details.expanded {
            display: table-row;
        }

        .details-container {
            padding: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
        }

        .detail-section {
            flex: 1;
            min-width: 300px;
        }

        .detail-section h4 {
            font-size: 0.70rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
        }

        .txt-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.70rem;
            font-weight: 600;
            border: 1px solid transparent;
        }

        .status-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border-color: rgba(16, 185, 129, 0.2);
        }

        .status-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .method-badge {
            font-family: 'JetBrains Mono', monospace;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.70rem;
            font-weight: 600;
            background: transparent;
            border: 1px solid currentColor;
        }

        .params-well {
            font-family: 'JetBrains Mono', monospace;
            background: #000;
            padding: 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.70rem;
            color: var(--text-primary);
            max-width: 500px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .json-key { color: #a78bfa; }
        .json-string { color: #34d399; }
        .json-number { color: #fbbf24; }
        .json-boolean { color: #60a5fa; }
        .json-null { color: #9ca3af; }

        .timestamp {
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .url-text {
            color: var(--text-primary);
            font-weight: 500;
            word-break: break-all;
        }

        @media (max-width: 1024px) {
            .params-well {
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Server Action Logs</h1>
                <div id="live-clock" style="color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; margin-top: 0.25rem;"></div>
            </div>
            <button id="refresh-btn" class="refresh-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                Refresh Logs
            </button>
        </header>

        <div class="filters-container" style="display: flex; gap: 2rem; margin-bottom: 2rem; background: var(--card-bg); padding: 1.5rem; border-radius: 1rem; border: 1px solid var(--border-color);">
            <div class="filter-group">
                <span style="color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-bottom: 0.5rem; display: block;">Method Filters</span>
                <div id="method-filters" style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 0.25rem; color: var(--text-primary); font-size: 0.85rem;"><input type="checkbox" value="GET" checked class="filter-cb method-cb"> GET</label>
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 0.25rem; color: var(--text-primary); font-size: 0.85rem;"><input type="checkbox" value="POST" checked class="filter-cb method-cb"> POST</label>
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 0.25rem; color: var(--text-primary); font-size: 0.85rem;"><input type="checkbox" value="PUT" checked class="filter-cb method-cb"> PUT</label>
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 0.25rem; color: var(--text-primary); font-size: 0.85rem;"><input type="checkbox" value="DELETE" checked class="filter-cb method-cb"> DELETE</label>
                </div>
            </div>
            <div class="filter-group">
                <span style="color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-bottom: 0.5rem; display: block;">Status Filters</span>
                <div id="status-filters" style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 0.25rem; color: var(--text-primary); font-size: 0.85rem;"><input type="checkbox" value="2xx" checked class="filter-cb status-cb"> 2xx (Success)</label>
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 0.25rem; color: var(--text-primary); font-size: 0.85rem;"><input type="checkbox" value="4xx" checked class="filter-cb status-cb"> 4xx (Client Err)</label>
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 0.25rem; color: var(--text-primary); font-size: 0.85rem;"><input type="checkbox" value="5xx" checked class="filter-cb status-cb"> 5xx (Server Err)</label>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Requests</div>
                <div id="total-requests" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Success Rate</div>
                <div id="success-rate" class="stat-value">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Critical Errors</div>
                <div id="error-count" class="stat-value" style="color: var(--error-color);">0</div>
            </div>
        </div>

        <div class="log-table-container">
            <div class="table-responsive">
                <table id="log-table">
                    <thead>
                        <tr>
                            <th style="width: 120px;">Timestamp</th>
                            <th style="width: 80px;">Method</th>
                            <th>Resource Path</th>
                            <th style="width: 80px;">Status</th>
                            <th style="width: 100px;">Duration</th>
                            <th style="width: 120px;">Client IP</th>
                        </tr>
                    </thead>
                    <tbody id="log-body">
                        <!-- Logs will be dynamically inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="log.js"></script>
</body>
</html>
