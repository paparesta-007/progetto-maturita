<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Support Management</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Quill Rich Text Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        :root {
            --primary: #f97316;
            --bg-light: #fdfdfd;
            --card-bg: #ffffff;
            --border: rgba(0, 0, 0, 0.08);
            --text: #1a1a1a;
            --text-muted: #666666;
            --panel-bg: #f5f5f7;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            padding: 0;
            margin: 0;
        }

        .header {
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background: #e5e5e7;
            transform: translateY(-1px);
        }

        .nav-btn.active {
            background: var(--text);
            border-color: var(--text);
            color: white;
        }

        .main-content {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .ticket-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 1250px;
            margin: 0 auto;
            width: 100%;
        }

        .ticket-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 18px 24px;
            border-radius: 16px;
            display: grid;
            grid-template-columns: 100px 1fr 140px 140px 120px;
            align-items: center;
            gap: 20px;
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .ticket-card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            transform: translateY(-2px);
        }

        .ticket-id { font-family: 'JetBrains Mono', monospace; color: var(--text-muted); font-size: 0.8rem; }
        .ticket-subject { font-weight: 700; font-size: 1.05rem; margin-bottom: 2px; }
        .ticket-email { color: var(--text-muted); font-size: 0.8rem; font-weight: 500; }
        
        .tag {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .tag-tech { background: #eff6ff; color: #1d4ed8; border: 1px solid #dbeafe; }
        .tag-billing { background: #fffbeb; color: #b45309; border: 1px solid #fef3c7; }
        .tag-open { background: #fef2f2; color: #b91c1c; border: 1px solid #fee2e2; }
        .tag-resolved { background: #f0fdf4; color: #15803d; border: 1px solid #dcfce7; }
        .tag-progress { background: #fdf4ff; color: #a21caf; border: 1px solid #fae8ff; }

        /* Floating Chat / Reply Modal */
        #replyModal {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 550px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.15);
            display: none;
            flex-direction: column;
            z-index: 1000;
            overflow: hidden;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(50px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .modal-header {
            padding: 16px 24px;
            background: #f8f9fa;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .original-context {
            background: #f1f3f5;
            padding: 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            border-left: 4px solid var(--primary);
        }

        .context-label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }

        /* Quill Editor customization */
        .editor-container {
            height: 250px;
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #editor {
            flex: 1;
            font-size: 0.95rem;
        }

        .modal-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding-top: 10px;
        }

        .status-select {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.85rem;
            background: white;
            outline: none;
            cursor: pointer;
        }

        .status-select:focus { border-color: var(--primary); }

        .modal-footer {
            padding: 16px 24px;
            background: #f8f9fa;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-send {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-send:hover { transform: translateY(-1px); filter: brightness(1.1); }
        .btn-send:disabled { opacity: 0.6; cursor: not-allowed; }

        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 80px;
            color: var(--text-muted);
        }
        
        .empty-state i {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: #dee2e6;
        }

        .link-cell { text-align: center; }
        .btn-view {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .btn-view:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <i class="fas fa-bolt" style="color: var(--primary);"></i>
            Gemini Admin
        </div>
        <div class="nav-buttons">
            <button class="nav-btn" id="btnLogs"><i class="fas fa-list-ul"></i> System Logs</button>
            <button class="nav-btn active" id="btnSupport"><i class="fas fa-life-ring"></i> Support Tickets</button>
        </div>
    </div>

    <div class="main-content" id="mainContent">
        <!-- Content will be injected here -->
    </div>

    <!-- Floating Chat Modal -->
    <div id="replyModal">
        <div class="modal-header">
            <h3 id="modalTitle" style="margin:0; font-size: 1rem; font-weight: 800;">REPLY TO CUSTOMER</h3>
            <button onclick="closeModal()" style="background:transparent; color:var(--text-muted); border:none; cursor:pointer; font-size: 1.2rem;"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="original-context">
                <span class="context-label">Customer Inquiry</span>
                <div id="originalSubject" style="font-weight: 800; margin-bottom: 5px; font-size: 0.95rem;"></div>
                <div id="originalMsg" style="line-height: 1.5; color: #444;"></div>
            </div>
            
            <div class="editor-section">
                <span class="context-label">Your Response</span>
                <div class="editor-container">
                    <div id="editor"></div>
                </div>
            </div>

            <div class="modal-controls">
                <div>
                    <span class="context-label">Action</span>
                    <select id="statusSelect" class="status-select">
                        <option value="resolved">Send & Resolve</option>
                        <option value="in-progress">Send & Keep In Progress</option>
                        <option value="open">Send & Keep Open</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-send" id="sendReplyBtn">
                <span id="btnText">Send Email</span>
                <i class="fas fa-paper-plane" id="sendIcon"></i>
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="index.js"></script>
</body>
</html>
